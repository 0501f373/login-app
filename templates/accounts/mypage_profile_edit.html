<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>登録情報変更</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        .header {
            padding: 16px 24px;
            background: #333;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: #2d6cdf;
            color: white;
        }

        .btn-back {
            background: #e5e5e5;
            color: #333;
        }
    </style>
</head>

<body>

<div class="header">
    登録情報変更
</div>

<div class="container">
    <h1>登録情報変更</h1>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>氏名</label>
                <input type="text" name="first_name" value="{{ request.user.first_name }}" required>
            </div>

            <div class="form-group">
                <label>電話番号</label>
                <input type="text" name="phone_number" value="{{ profile.phone_number }}" placeholder="例：09012345678">
                <p class="hint">ハイフンなしでも入力できます。</p>
            </div>

            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" name="email" value="{{ request.user.email }}" required>
            </div>

            <div class="actions">
                <a href="{% url 'mypage' %}" class="btn btn-back">
                    戻る
                </a>

                <button type="submit" class="btn btn-primary">
                    保存する
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
