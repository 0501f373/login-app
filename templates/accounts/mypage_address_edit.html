<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>登録住所編集</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #333;
            color: white;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 16px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: #2d6cdf;
            color: white;
        }

        .btn-back {
            background: #e5e5e5;
            color: #333;
        }
    </style>
</head>
<body>

<div class="header">
    <div>登録住所編集</div>
    <div>
        <a href="{% url 'mypage' %}">マイページ</a>
        <a href="{% url 'logout' %}">ログアウト</a>
    </div>
</div>

<div class="container">
    <h1>登録住所編集</h1>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>郵便番号</label>
                <input type="text" name="postal_code" value="{{ address.postal_code|default:'' }}" placeholder="例：123-4567" required>
            </div>

            <div class="form-group">
                <label>都道府県</label>
                <input type="text" name="prefecture" value="{{ address.prefecture|default:'' }}" placeholder="例：東京都" required>
            </div>

            <div class="form-group">
                <label>市区町村</label>
                <input type="text" name="city" value="{{ address.city|default:'' }}" placeholder="例：新宿区" required>
            </div>

            <div class="form-group">
                <label>番地</label>
                <input type="text" name="address" value="{{ address.address|default:'' }}" placeholder="例：西新宿1-1-1" required>
            </div>

            <div class="form-group">
                <label>建物名・部屋番号</label>
                <input type="text" name="building" value="{{ address.building|default:'' }}" placeholder="例：〇〇マンション101">
            </div>

            <div class="actions">
                <a href="{% url 'mypage' %}" class="btn btn-back">
                    マイページへ戻る
                </a>

                <button type="submit" class="btn btn-primary">
                    保存する
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
