<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理者削除確認</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .btn-area {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>管理者削除確認</h2>
        <p>{{ staff_user.first_name }}（{{ staff_user.email }}）を削除しますか？</p>

        <form method="post">
            {% csrf_token %}
            <div class="btn-area">
                <a href="{% url 'staff_list' %}" class="btn back-btn">管理者一覧へ戻る</a>
                <button type="submit" class="btn delete-btn">削除する</button>
            </div>
        </form>
    </div>
</body>
</html>
