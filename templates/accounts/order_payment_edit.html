<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>支払い方法編集</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
        .header { padding: 16px 24px; background: #333; color: white; }
        .container { max-width: 700px; margin: 0 auto; padding: 32px 24px; }
        .form-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .radio-label { display: block; margin-bottom: 14px; font-weight: normal; }
        input[type="radio"] { margin-right: 8px; }
        .actions { display: flex; justify-content: space-between; margin-top: 24px; }
        .btn { text-decoration: none; border: none; border-radius: 8px; padding: 10px 18px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #2d6cdf; color: white; }
        .btn-back { background: #e5e5e5; color: #333; }
    </style>
</head>
<body>

<div class="header">支払い方法編集</div>

<div class="container">
    <h1>支払い方法編集</h1>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <label class="radio-label">
                <input type="radio" name="payment_method" value="credit_card"
                {% if request.session.payment_method == "credit_card" or not request.session.payment_method %}checked{% endif %}>
                クレジットカード
            </label>

            <label class="radio-label">
                <input type="radio" name="payment_method" value="bank_transfer"
                {% if request.session.payment_method == "bank_transfer" %}checked{% endif %}>
                銀行振込
            </label>

            <label class="radio-label">
                <input type="radio" name="payment_method" value="cash_on_delivery"
                {% if request.session.payment_method == "cash_on_delivery" %}checked{% endif %}>
                代金引換
            </label>

            <div class="actions">
                <a href="{% url 'order_confirm' %}" class="btn btn-back">戻る</a>
                <button type="submit" class="btn btn-primary">保存する</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
