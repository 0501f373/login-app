<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品検索画面</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        /* ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #333;
            color: white;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .header a:hover {
            text-decoration: underline;
        }

        /* 中身 */
        .container {
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <div class="header">
        <div>
            商品検索
        </div>

        <div>
            <a href="/login/">ログイン</a>
            <a href="/signup/">新規登録</a>
        </div>
    </div>

    <!-- メイン -->
    <div class="container">
        <h1>商品検索画面</h1>

        <form method="get">
            <input type="text" name="keyword" placeholder="商品名" value="{{ keyword }}">
            <input type="text" name="category" placeholder="カテゴリ" value="{{ category }}">
            <button type="submit">検索</button>
        </form>

        <hr>

        <div class="product-list">
            {% for product in products %}
                <div class="card">
                    <h2>
                        <a href="{% url 'product_detail' product.id %}">
                            {{ product.name }}
                        </a>
                    </h2>
                    <p>カテゴリ: {{ product.category }}</p>
                    <p>価格: {{ product.price }}円</p>
                    <p>{{ product.description }}</p>
                </div>
            {% empty %}
                <p>該当する商品がありません。</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
