<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品検索画面</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #333;
            color: white;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        .header-links a {
            color: white;
            text-decoration: none;
            margin-left: 16px;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            margin-bottom: 24px;
        }

        form input {
            padding: 10px;
            margin-right: 8px;
            margin-bottom: 8px;
            width: 220px;
        }

        form button {
            padding: 10px 16px;
            cursor: pointer;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 22px;
        }

        .card h2 a {
            color: #222;
            text-decoration: none;
        }

        .card h2 a:hover {
            text-decoration: underline;
        }

        .price {
            font-weight: bold;
            color: #2c3e50;
        }

        .empty {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        {% if request.user.is_authenticated %}
  {{ request.user.first_name }}
{% endif %}

    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">商品検索</div>
        <div class="header-links">
            <a href="/login/">ログイン</a>
            <a href="/signup/">新規登録</a>
        </div>
    </div>

    <div class="container">
        <h1>商品検索画面</h1>

        <form method="get">
            <input type="text" name="keyword" placeholder="商品名" value="{{ keyword }}">
            <select name="category">
    <option value="">すべて</option>
    {% for c in categories %}
        <option value="{{ c }}" {% if c == category %}selected{% endif %}>
            {{ c }}
        </option>
    {% endfor %}
</select>
            <button type="submit">検索</button>
        </form>

        {% if products %}
            <div class="product-list">
                {% for product in products %}
                    <div class="card">
                        <h2>
                            <a href="{% url 'product_detail' product.id %}">
                                {{ product.name }}
                            </a>
                        </h2>
                        <p>カテゴリ: {{ product.category }}</p>
                        <p class="price">価格: {{ product.price }}円</p>
                        <p>{{ product.description }}</p>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">
                <p>該当する商品がありません。</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
