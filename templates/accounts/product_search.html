<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品検索画面</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            margin-bottom: 30px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <h1>商品検索画面</h1>

    <form method="get">
    <input type="text" name="keyword" placeholder="商品名" value="{{ keyword }}">
    <input type="text" name="category" placeholder="カテゴリ" value="{{ category }}">
    <button type="submit">検索</button>
</form>

    <div class="product-list">
        {% for product in products %}
            <div class="card">
                <h2>{{ product.name }}</h2>
                <p>カテゴリ: {{ product.category }}</p>
                <p class="price">価格: {{ product.price }}円</p>
                <p>{{ product.description }}</p>
            </div>
        {% empty %}
            <p>該当する商品がありません。</p>
        {% endfor %}
    </div>
</body>
</html>
