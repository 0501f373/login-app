<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: #333;
            color: white;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .required {
            color: red;
            margin-left: 4px;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        .error-box {
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: #2d6cdf;
            color: white;
        }

        .btn-back {
            background: #e5e5e5;
            color: #333;
        }
    </style>
</head>
<body>

<div class="header">パスワード変更</div>

<div class="container">
    <div class="form-card">
        <h1>パスワード変更</h1>

        {% if errors %}
            <div class="error-box">
                {% for error in errors %}
                    <div>{{ error }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>現在のパスワード <span class="required">*</span></label>
                <input type="password" name="current_password">
            </div>

            <div class="form-group">
                <label>新しいパスワード <span class="required">*</span></label>
                <input type="password" name="new_password">
                <p class="hint">8文字以上、アルファベットと数字を含めてください。</p>
            </div>

            <div class="form-group">
                <label>新しいパスワード（確認） <span class="required">*</span></label>
                <input type="password" name="new_password_confirm">
            </div>

            <div class="actions">
                <a href="{% url 'mypage' %}" class="btn btn-back">マイページへ戻る</a>
                <button type="submit" class="btn btn-primary">変更する</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
