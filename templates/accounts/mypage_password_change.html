<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
</head>
<body>

<h1>パスワード変更</h1>

{% if errors %}
    <ul style="color:red;">
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label>現在のパスワード</label><br>
        <input type="password" name="current_password">
    </p>

    <p>
        <label>新しいパスワード</label><br>
        <input type="password" name="new_password">
    </p>

    <p>
        <label>新しいパスワード（確認）</label><br>
        <input type="password" name="new_password_confirm">
    </p>

    <button type="submit">変更する</button>
</form>

<a href="{% url 'mypage' %}">マイページへ戻る</a>

</body>
</html>
