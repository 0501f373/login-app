<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品詳細画面</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #333;
            color: white;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        .header-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-links a,
        .header-links span {
            color: white;
            text-decoration: none;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .detail-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .detail-card h1 {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .detail-row {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .label {
            font-weight: bold;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #333;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">商品詳細</div>
        <div class="header-links">
            {% if request.user.is_authenticated %}
                <span>{{ request.user.first_name }}</span>
            {% else %}
                <a href="/login/">ログイン</a>
                <a href="/signup/">新規登録</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        <div class="detail-card">
            <h1>{{ product.name }}</h1>

            <div class="detail-row">
                <span class="label">カテゴリ:</span> {{ product.category }}
            </div>

            <div class="detail-row price">
                価格: {{ product.price }}円
            </div>

            <div class="detail-row">
                <span class="label">商品説明:</span><br>
                {{ product.description }}
            </div>

            <a href="{% url 'product_search' %}" class="back-link">← 商品検索へ戻る</a>
        </div>
    </div>
</body>
</html>
