<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理メニュー</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            display: block;
            padding: 16px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 18px;
            background: #ddd;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>管理メニュー</h1>

        <div class="menu-list">
            <a href="{% url 'management_product_list' %}" class="menu-btn">商品一覧確認</a>
            <a href="{% url 'product_create' %}" class="menu-btn">商品登録</a>
            <a href="{% url 'product_edit_menu' %}" class="menu-btn">商品編集</a>
            <a href="{% url 'category_create' %}" class="menu-btn">カテゴリ登録</a>
            <a href="{% url 'manufacturer_create' %}" class="menu-btn">メーカー登録</a>
            <a href="{% url 'staff_signup' %}" class="menu-btn">管理者登録</a>
        </div>

        <a href="{% url 'staff_logout' %}" class="back-btn">サインアウト</a>
    </div>
</body>
</html>
