<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ登録</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 20px;
        }

        .btn-area {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            background: #333;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #333;
        }

        .message {
            color: green;
            margin-bottom: 16px;
        }

        .category-list {
            margin-top: 20px;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>カテゴリ登録</h1>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="name">カテゴリ名</label>
            <input type="text" name="name" id="name">

            <div class="btn-area">
                <button type="submit" class="btn save-btn">登録する</button>
                <a href="{% url 'management_menu' %}" class="btn back-btn">管理メニューに戻る</a>
            </div>
        </form>
        <h2>カテゴリ一覧</h2>

<ul class="category-list">
    {% for category in categories %}
        <li>{{ category.name }}</li>
    {% empty %}
        <li>カテゴリはまだありません</li>
    {% endfor %}
</ul>
    </div>
</body>
</html>
