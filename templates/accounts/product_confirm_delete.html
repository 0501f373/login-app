<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>削除確認</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .btn-area {
            margin-top: 20px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            margin: 0 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>削除確認</h2>
        <p>{{ product.name }} を削除しますか？</p>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_page }}">

            <div class="btn-area">
                {% if next_page == "management_product_list" %}
                    <a href="{% url 'management_product_list' %}" class="btn back-btn">商品一覧確認へ戻る</a>
                {% else %}
                    <a href="{% url 'management_menu' %}" class="btn back-btn">管理メニューへ戻る</a>
                {% endif %}

                <button type="submit" class="btn delete-btn">削除する</button>
            </div>
        </form>
    </div>
</body>
</html>
