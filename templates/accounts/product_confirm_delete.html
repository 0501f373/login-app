<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>削除確認</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .btn-area {
            margin-top: 20px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            margin: 0 8px;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        .back-btn {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>削除確認</h2>
        <p>{{ product.name }} を削除しますか？</p>

        <form method="post">
            {% csrf_token %}
            <div class="btn-area">
                <button type="submit" class="btn delete-btn">削除する</button>
                <a href="{% url 'product_detail' product.id %}?from_manage=1" class="btn back-btn">戻る</a>
            </div>
        </form>
    </div>
</body>
</html>
