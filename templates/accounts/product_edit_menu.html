<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品編集</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .category-group {
            margin-bottom: 28px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .edit-btn {
            padding: 8px 14px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 18px;
            background: #ddd;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>商品編集</h1>

        {% for category in categories %}
            <div class="category-group">
                <h3>{{ category.name }}</h3>

                {% for product in category.product_set.all %}
                    <div class="product-item">
                        <span>{{ product.name }}</span>
                        <a href="{% url 'product_detail' product.id %}?from_manage=1" class="edit-btn">詳細</a>
                    </div>
                {% empty %}
                    <p>このカテゴリの商品はありません</p>
                {% endfor %}
            </div>
        {% endfor %}

        <div class="category-group">
            <h3>未選択</h3>

            {% for product in uncategorized_products %}
                <div class="product-item">
                    <span>{{ product.name }}</span>
                    <a href="{% url 'product_detail' product.id %}?from_manage=1" class="edit-btn">詳細</a>
                </div>
            {% empty %}
                <p>未選択の商品はありません</p>
            {% endfor %}
        </div>

        <a href="{% url 'management_menu' %}" class="back-btn">戻る</a>
    </div>
</body>
</html>
