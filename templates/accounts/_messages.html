{% if messages %}
    <div id="flash-messages">
        {% for message in messages %}
            <div class="flash-message {% if message.tags == 'success' %}flash-success{% elif message.tags == 'error' %}flash-error{% else %}flash-default{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>

    <style>
        #flash-messages {
            margin-bottom: 16px;
        }

        .flash-message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .flash-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .flash-error {
            background: #ffebee;
            color: #c62828;
        }

        .flash-default {
            background: #eeeeee;
            color: #333;
        }

        .flash-hide {
            opacity: 0;
        }
    </style>

    <script>
        setTimeout(function() {
            const flashBox = document.getElementById("flash-messages");
            if (flashBox) {
                flashBox.classList.add("flash-hide");
                setTimeout(function() {
                    flashBox.remove();
                }, 500);
            }
        }, 2000);
    </script>
{% endif %}
