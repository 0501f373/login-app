<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>配送先編集</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
        .header { padding: 16px 24px; background: #333; color: white; }
        .container { max-width: 700px; margin: 0 auto; padding: 32px 24px; }
        .form-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .error { color: red; font-weight: bold; }
        .actions { display: flex; justify-content: space-between; margin-top: 24px; }
        .btn { text-decoration: none; border: none; border-radius: 8px; padding: 10px 18px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #2d6cdf; color: white; }
        .btn-back { background: #e5e5e5; color: #333; }
    </style>
</head>
<body>

<div class="header">配送先編集</div>

<div class="container">
    <h1>配送先編集</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>郵便番号</label>
                <input type="text" name="postal_code" value="{{ address.postal_code|default:'' }}">
            </div>

            <div class="form-group">
                <label>都道府県</label>
                <input type="text" name="prefecture" value="{{ address.prefecture|default:'' }}">
            </div>

            <div class="form-group">
                <label>市区町村</label>
                <input type="text" name="city" value="{{ address.city|default:'' }}">
            </div>

            <div class="form-group">
                <label>番地</label>
                <input type="text" name="address" value="{{ address.address|default:'' }}">
            </div>

            <div class="form-group">
                <label>建物名・部屋番号</label>
                <input type="text" name="building" value="{{ address.building|default:'' }}">
            </div>

            <div class="actions">
                <a href="{% url 'order_confirm' %}" class="btn btn-back">戻る</a>
                <button type="submit" class="btn btn-primary">保存する</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
