<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者登録</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .error {
            color: red;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 16px;
        }

        .link a {
            color: #2d6cdf;
            text-decoration: none;
        }

        ul.error-list {
            color: red;
            padding-left: 20px;
            margin-top: 0;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="signup-box">
        <h1>管理者登録</h1>

        {% if errors %}
            <ul class="error-list">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="display_name">ユーザー名</label>
                <input type="text" id="display_name" name="display_name" value="{{ display_name|default:'' }}" required>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" value="{{ email|default:'' }}" required>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">パスワード確認</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit">登録する</button>
        </form>

        <div class="link">
            <a href="{% url 'management_menu' %}">管理メニューへ戻る</a>
        </div>
    </div>
</body>
</html>
