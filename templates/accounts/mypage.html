<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイページ</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #333;
            color: white;
        }

        .header-links a {
            color: white;
            text-decoration: none;
            margin-left: 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .form-card,
        .order-card,
        .empty {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #2d6cdf;
            color: white;
        }

        .btn-back {
            background: #e5e5e5;
            color: #333;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .actions {
            margin-top: 24px;
        }

        .link {
            text-decoration: none;
            color: #333;
            font-size: 15px;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="header">
    <div>マイページ</div>

    <div class="header-links">
        <a href="{% url 'cart' %}">
            カート（{{ cart_count }}）
        </a>

        <a href="{% url 'logout' %}">
            ログアウト
        </a>
    </div>
</div>

<div class="container">

    <h1 class="page-title">マイページ</h1>

    <div class="form-card">
    <h2>会員情報</h2>

    <div style="margin-top: 16px; display:flex; flex-direction:column; gap:12px;">
        <a href="{% url 'mypage_profile_edit' %}" class="link">
            登録情報変更
        </a>

        <a href="{% url 'mypage_address_list' %}" class="link">
            お届け先の追加・変更
        </a>

        <a href="{% url 'mypage_password_change' %}">パスワード変更</a>
    </div>
</div>


    {% if orders %}
    <div class="order-card">
        <h2>注文履歴</h2>

        <div style="margin-top: 12px;">
            <a href="{% url 'order_list' %}" class="link">
                注文履歴を見る
            </a>
        </div>
    </div>

    {% else %}

        <div class="empty">
            <p>注文履歴はありません。</p>
        </div>

    {% endif %}

    <div class="actions">
        <a href="{% url 'product_search' %}" class="btn btn-back">
            商品一覧へ戻る
        </a>
    </div>
</div>

</body>
</html>
