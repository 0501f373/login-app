<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>購入完了</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            margin-bottom: 16px;
        }

        p {
            color: #555;
            margin-bottom: 32px;
        }

        .btn-area {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            background: #333;
        }

        .btn-sub {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>購入が完了しました</h1>
        <p>ご注文ありがとうございます。注文内容はマイページから確認できます。</p>

        <div class="btn-area">
            <a href="{% url 'order_list' %}" class="btn btn-primary">マイページで注文履歴を見る</a>
            <a href="{% url 'product_search' %}" class="btn btn-sub">商品一覧へ戻る</a>
        </div>
    </div>
</body>
</html>
